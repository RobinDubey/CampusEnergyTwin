
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Campus Buildings</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
    <style>
        .page-content { max-width: 1200px; margin: 30px auto; padding: 20px; }
        .building-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 20px; }
        .building-card { background: white; color: #172554; padding: 25px; border-radius: 16px; border: 1px solid #dbe4f0; border-top: 5px solid #3b82f6; box-shadow: 0 8px 25px #1e3a8a12; }
        .building-card h2 { font-size: 20px; }
        .building-card strong { font-size: 30px; color: #2563eb; }
        
/* Modern Campus Buildings Design */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

body {
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, #edf2ff, #f8faff, #e7edff);
    color: #172554;
    margin: 0;
}

/* Main page */
.page-content {
    max-width: 1400px;
    margin: 35px auto;
    padding: 30px;
}

/* Main heading */
.page-content h1 {
    font-size: clamp(32px, 4vw, 46px);
    font-weight: 800;
    letter-spacing: -1.5px;
    color: #172554;
    margin-bottom: 10px;
}

.page-content p {
    color: #64748b;
    font-size: 16px;
    line-height: 1.8;
}

/* Building cards layout */
.build-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin-top: 28px;
}

/* Individual building cards */
.building-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(145deg, #ffffff, #f8faff);
    color: #172554;
    padding: 28px 24px;
    border: 1px solid #dbe5ff;
    border-top: 5px solid #4f46e5;
    border-radius: 20px;
    min-height: 190px;
    box-shadow: 0 8px 24px rgba(44, 70, 140, 0.08);
    transition: transform 0.3s ease,
                box-shadow 0.3s ease,
                border-color 0.3s ease;
}

/* Decorative circle */
.building-card::after {
    content: "";
    position: absolute;
    width: 110px;
    height: 110px;
    right: -38px;
    bottom: -42px;
    border-radius: 50%;
    background: rgba(79, 70, 229, 0.07);
    pointer-events: none;
}

/* Hover animation */
.building-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 35px rgba(44, 70, 140, 0.17);
    border-top-color: #06b6d4;
}

/* Building name */
.building-card h2,
.building-card h3,
.building-card h4 {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 24px;
    color: #1e293b;
}

/* Energy value */
.building-card strong {
    display: block;
    font-size: 32px;
    font-weight: 800;
    color: #4338ca;
    margin: 12px 0;
    letter-spacing: -0.5px;
}

/* Responsive for mobile */
@media (max-width: 600px) {
    .page-content {
        padding: 18px;
        margin: 15px auto;
    }

    .build-grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }

    .building-card {
        padding: 22px;
        min-height: 150px;
    }
}

/* Premium Large Navigation */
.main-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;

    width: 92%;
    max-width: 1350px;
    min-height: 86px;
    margin: 25px auto;
    padding: 18px 24px;
    box-sizing: border-box;

    background: linear-gradient(
        120deg,
        #101b43,
        #263f88,
        #365ee8
    );

    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 22px;

    box-shadow:
        0 14px 35px rgba(38,63,136,0.25),
        inset 0 1px 0 rgba(255,255,255,0.15);

    position: relative;
    z-index: 10;
}

.main-nav a {
    color: #fff;
    text-decoration: none;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 700;

    padding: 16px 25px;
    border-radius: 13px;
    white-space: nowrap;

    transition: all 0.3s ease;
}

.main-nav a:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
}

.main-nav a:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 3px;
}

@media (max-width: 600px) {
    .main-nav {
        width: 95%;
        min-height: auto;
        padding: 10px;
        gap: 5px;
    }

    .main-nav a {
        font-size: 13px;
        padding: 11px 12px;
    }
}   

/* Matching Analytics header */
.analytics-topbar {
    background: linear-gradient(120deg, #172554, #304fc4, #4267ed);
    color: #fff;
    padding: 30px 3.3%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 28px;
    flex-wrap: wrap;
    box-shadow: 0 10px 30px rgba(23, 37, 84, 0.20);
}

.analytics-brand {
    flex: 1;
    min-width: 260px;
}

.analytics-brand .eyebrow {
    color: #c7d8ff;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    margin: 0 0 12px;
}

.analytics-brand h1 {
    color: #fff;
    font-size: clamp(30px, 3.5vw, 46px);
    font-weight: 800;
    margin: 0 0 10px;
}

.analytics-brand .subtitle {
    color: #e0eaff;
    font-size: 15px;
    margin: 0;
    line-height: 1.7;
}

.analytics-topbar .main-nav {
    margin: 0;
    flex-shrink: 0;
}

.analytics-topbar .main-nav a.active {
    background: #4267ed;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
}

@media (max-width: 850px) {
    .analytics-topbar {
        flex-direction: column;
        align-items: stretch;
    }

    .analytics-topbar .main-nav {
        width: auto;
        max-width: 100%;
        justify-content: flex-start;
    }
} 
/* Move Buildings navigation box right and down */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 30px;
}

.topbar .main-nav {
    margin-left: auto !important;
    margin-right: 20px !important;
    position: relative;
    right: 0;
    top: 60px;
    flex-shrink: 0;
}</style>
</head>
<body>
    
<header class="topbar analytics-topbar">
    <div class="analytics-brand">
        <p class="eyebrow">SMART CAMPUS MANAGEMENT</p>
        <h1>Campus Buildings</h1>
        <p class="subtitle">
            Monitor energy usage across campus buildings.
        </p>
    </div>

    <nav class="main-nav">
        <a href="/">Dashboard</a>
        <a href="/buildings" class="active">Buildings</a>
        <a href="/analytics">Analytics</a>
        <a href="/schedule">Energy Schedule</a>
        <a href="/alerts">Alerts Center</a>
    </nav>
</header>
    <main class="page-content">
        <h1>Campus Buildings</h1>
        <p>Monitor energy usage across campus buildings.</p>
        <p id="status">Loading building data...</p>
        <div id="buildingCards" class="building-grid"></div>
    </main>

    <script>
    async function loadBuildings() {
        const status = document.getElementById("status");
        const container = document.getElementById("buildingCards");

        try {
            const response = await fetch("/api/dashboard");
            if (!response.ok) throw new Error("API request failed");

            const data = await response.json();
            container.replaceChildren();

            Object.entries(data.building_totals || {}).forEach(([name, energy]) => {
                const card = document.createElement("article");
                card.className = "building-card";

                const title = document.createElement("h2");
                title.textContent = name;

                const value = document.createElement("strong");
                value.textContent = `${energy} kWh`;

                const caption = document.createElement("p");
                caption.textContent = "Energy consumption";

                card.append(title, value, caption);
                container.appendChild(card);
            });

            status.textContent =
                `Total campus energy: ${data.total_energy_kwh} kWh`;
        } catch (error) {
            status.textContent = "Unable to load building data. Please refresh.";
            console.error(error);
        }
    }

    loadBuildings();
    </script>
    
<script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
